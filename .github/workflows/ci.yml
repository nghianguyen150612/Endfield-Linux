name: Rust CI

on:
  push:
    branches: [main, feat/p028-isolated-prefix-management]
  pull_request:
    branches: [main, feat/p028-isolated-prefix-management]

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, metadata, diagnostics, and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install GTK build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev libadwaita-1-dev librsvg2-common pkg-config dbus-daemon xvfb python3-jsonschema

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: clippy, rustfmt

      - name: Validate the canonical user unit with systemd-analyze
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import tempfile

          source = Path("packaging/systemd/user/endfield-unixd.service").read_text(encoding="utf-8")
          expected = "ExecStart=%h/.local/bin/endfield-unixd --foreground"
          assert source.count(expected) == 1
          validation = source.replace(expected, "ExecStart=/usr/bin/true --foreground")
          with tempfile.TemporaryDirectory(prefix="endfield-p020-unit-") as directory:
              unit = Path(directory) / "endfield-unixd.service"
              unit.write_text(validation, encoding="utf-8")
              subprocess.run(["systemd-analyze", "verify", str(unit)], check=True)
          PY

      - name: Run optional isolated systemd user-manager integration
        if: ${{ vars.ENDFIELD_SYSTEMD_USER_INTEGRATION == '1' }}
        run: |
          cargo build --locked --release -p endfield-unix -p endfield-unixd
          set +e
          ENDFIELD_SYSTEMD_USER_INTEGRATION=1 ENDFIELD_DISPOSABLE_TEST_ACCOUNT=1 scripts/systemd-user-integration.sh
          result=$?
          set -e
          if [ "$result" -eq 77 ]; then
            echo "Real systemd --user integration: UNVERIFIED (optional runner gate unavailable)."
            exit 0
          fi
          exit "$result"

      - name: Mark real systemd user-manager integration unavailable
        if: ${{ vars.ENDFIELD_SYSTEMD_USER_INTEGRATION != '1' }}
        run: |
          echo "Real systemd --user integration: UNVERIFIED (optional isolated-manager gate is not enabled)."

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build application binaries for the Linux IPC subprocess tests
        run: cargo build --locked -p endfield-unix -p endfield-unixd

      - name: Validate P034 blocked launch plan JSON and schema
        run: |
          root="$(mktemp -d)"
          set +e
          HOME="$root" XDG_CONFIG_HOME="$root/config" XDG_DATA_HOME="$root/data" XDG_CACHE_HOME="$root/cache" \
            ./target/debug/endfield-unix game launch plan --id endfield-main --prefix-id prefix-main --profile desktop --adapter managed-wine --executable-relative SelectedExecutable.exe --json \
            > /tmp/p034-launch-plan.json
          status=$?
          set -e
          test "$status" -eq 78
          python3 - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          from pathlib import Path

          schema = json.loads(Path("docs/schema/game-launch-plan-v1.schema.json").read_text())
          report = json.loads(Path("/tmp/p034-launch-plan.json").read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(report)
          assert report["state"] == "blocked"
          assert report["process_execution_supported"] is False
          assert report["expected_process_behavior"] == "no_process_created"
          assert report["policy"]["process_creation_allowed"] is False
          assert "game_not_registered" in report["blockers"]
          assert "execution_policy_unknown" in report["blockers"]
          print("P034 blocked launch plan matches the versioned JSON schema.")
          PY
          test ! -e "$root/config" && test ! -e "$root/data" && test ! -e "$root/cache"

      - name: Run P024 offline cryptographic CLI smoke
        run: scripts/runtime-integrity-smoke.sh

      - name: Run P024 verification contracts
        run: cargo test --locked -p endfield-unix-runtime-verification

      - name: Run P025 installation policy, extraction, recovery, and concurrency tests
        run: cargo test --locked -p endfield-unix-runtime-install --all-targets

      - name: Run P026 installed runtime audit and baseline tests
        run: cargo test --locked -p endfield-unix-runtime-audit --all-targets

      - name: Run P027 runtime pin contracts and persistence tests
        run: cargo test --locked -p endfield-unix-runtime-selection --all-targets

      - name: Run P029 snapshot, restore, deletion, rollback, and fault-injection tests
        run: cargo test --locked -p endfield-unix-prefix-management backup::tests

      - name: Run P029B durable deletion and rollback recovery tests
        run: cargo test --locked -p endfield-unix-prefix-management backup::recovery_tests

      - name: Run P028 isolated prefix lifecycle and filesystem safety tests
        run: cargo test --locked -p endfield-unix-prefix-management --all-targets

      - name: Run P033 portable dependency assessment tests
        run: cargo test --locked -p endfield-unix-dependency-diagnostics --all-targets

      - name: Run actual P033 dependency CLI integration
        run: cargo test --locked -p endfield-unix --test dependency_cli -- --test-threads=1 --nocapture

      - name: Validate actual P033 JSON schema
        run: |
          ./target/debug/endfield-unix diagnose dependencies --source-id steam --json > /tmp/p033-schema-report.json
          /usr/bin/python3 scripts/validate-dependency-schema.py /tmp/p033-schema-report.json

      - name: Run P030 portable compatibility assessment tests
        run: cargo test --locked -p endfield-unix-compatibility-diagnostics --all-targets

      - name: Run actual P030 compatibility CLI integration
        run: cargo test --locked -p endfield-unix --test compatibility_cli -- --test-threads=1 --nocapture

      - name: Run P031 game-import registry and filesystem safety tests
        run: cargo test --locked -p endfield-unix-game-import --all-targets -- --test-threads=1

      - name: Run P032 official catalog and bounded Steam observation tests
        run: cargo test --locked -p endfield-unix-game-sources --all-targets

      - name: Run actual P032 headless CLI with network and child creation denied
        run: cargo test --locked -p endfield-unix --test game_sources_cli -- --test-threads=1 --nocapture

      - name: Run actual P031 game-import CLI integration
        run: cargo test --locked -p endfield-unix --test game_import_cli -- --test-threads=1 --nocapture

      - name: Run actual P025 install and P027/P028 CLI smoke in an isolated XDG root
        run: cargo test --locked -p endfield-unix --test runtime_install_cli -- --test-threads=1 --nocapture

      - name: Run actual P029 backup restore recovery and pin CAS CLI qualification
        run: cargo test --locked -p endfield-unix --test prefix_backup_cli -- --test-threads=1 --nocapture

      - name: Run headless installed Wine and Proton discovery smoke
        run: |
          ./target/debug/endfield-unix diagnose runtimes | tee /tmp/endfield-runtime-discovery.txt
          grep -Fq "Runtime discovery: Linux" /tmp/endfield-runtime-discovery.txt
          grep -Eq "Discovered runtimes: [0-9]+" /tmp/endfield-runtime-discovery.txt
          grep -Eq "Discovery result: (complete|partial)" /tmp/endfield-runtime-discovery.txt

      - name: Run read-only UMU discovery and integration smoke
        run: |
          ./target/debug/endfield-unix diagnose umu | tee /tmp/endfield-umu-discovery.txt
          grep -Fq "UMU integration: Linux" /tmp/endfield-umu-discovery.txt
          grep -Fq "UMU version: unknown" /tmp/endfield-umu-discovery.txt
          grep -Fq "Runtime execution: not performed" /tmp/endfield-umu-discovery.txt
          grep -Fq "Game execution: not performed" /tmp/endfield-umu-discovery.txt

      - name: Run the headless Linux platform CLI against this runner
        run: ./target/debug/endfield-unix diagnose platform

      - name: Run the headless Linux hardware CLI against this runner
        run: ./target/debug/endfield-unix diagnose hardware

      - name: Run bounded headless Linux CPU and memory telemetry
        run: ./target/debug/endfield-unix diagnose telemetry cpu-memory --interval-ms 250

      - name: Run deterministic frame-file CLI smoke
        run: |
          ./target/debug/endfield-unix diagnose telemetry frames --format frame-events-v1 --input crates/platform-linux/tests/fixtures/frame-events-v1.csv | tee /tmp/endfield-frame-telemetry.txt
          grep -Fq "Valid frame interval observations: 2" /tmp/endfield-frame-telemetry.txt
          grep -Fq "FPS: 100.000 FPS" /tmp/endfield-frame-telemetry.txt
          grep -Fq "Mean frametime: 10.000000 ms" /tmp/endfield-frame-telemetry.txt

      - name: Run headless GPU telemetry without a display or daemon
        run: ./target/debug/endfield-unix diagnose telemetry gpu

      - name: Run the headless Linux GPU CLI against this runner
        run: ./target/debug/endfield-unix diagnose gpu

      - name: Run the headless Linux display CLI against this runner
        run: ./target/debug/endfield-unix diagnose display

      - name: Run the Linux X11/RandR display smoke under Xvfb
        run: |
          xvfb-run -a -s "-screen 0 1600x900x24 +extension RANDR" dbus-run-session -- sh -eu -c '
            ./target/debug/endfield-unix diagnose display | tee /tmp/endfield-unix-xvfb-display.txt
            grep -Fq "X11/RandR: connected (output inventory: enumerated)" /tmp/endfield-unix-xvfb-display.txt
            grep -Fq "Screen geometry: 1600×900 pixels" /tmp/endfield-unix-xvfb-display.txt
          '

      - name: Run Linux platform-adapter parser and live-probe tests
        run: cargo test --locked -p endfield-unix-platform-linux --all-targets

      - name: Run normalized telemetry contract tests
        run: cargo test --locked -p endfield-unix-telemetry --all-targets

      - name: Run P021 runtime provider contract tests
        run: cargo test --locked -p endfield-unix-runtime --all-targets

      - name: Verify isolated empty-host runtime discovery semantics
        run: cargo test --locked -p endfield-unix-runtime-linux --test absence_semantics empty_home_and_missing_conventional_roots_are_a_complete_empty_inventory

      - name: Run P022 Linux runtime discovery contracts
        run: cargo test --locked -p endfield-unix-runtime-linux --all-targets

      - name: Run serialized workspace, CLI, FFI, storage, domain, and diagnostics tests
        run: umask 077; cargo test --locked --workspace -- --test-threads=1

      - name: Run session lifecycle, registry, child-process, and shutdown contracts
        run: cargo test --locked -p endfield-unix-sessions --all-targets -- --test-threads=1

      - name: Run daemon supervisor worker ownership integration
        run: cargo test --locked -p endfield-unixd --test sessions -- --test-threads=1

      - name: Run bounded headless daemon lifecycle gate
        run: cargo test --locked -p endfield-unixd --test lifecycle -- --test-threads=1

      - name: Run bounded Linux daemon and CLI IPC integration gate
        run: cargo test --locked -p endfield-unix --test ipc_e2e -- --test-threads=1

      - name: Run graphical smoke test
        env:
          ENDFIELD_GUI_SCREENSHOT: /tmp/endfield-unix-gtk-smoke.png
          GSK_RENDERER: cairo
          GTK_A11Y: none
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a dbus-run-session -- cargo test --locked --workspace --test gui_smoke -- --ignored --test-threads=1

      - name: Upload GTK smoke screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: endfield-unix-gtk-smoke
          path: /tmp/endfield-unix-gtk-smoke.png
          if-no-files-found: error
          retention-days: 7

      - name: Build workspace
        run: cargo build --locked --workspace

      - name: Validate Cargo metadata
        run: |
          cargo metadata --locked --no-deps --format-version 1 > /tmp/endfield-cargo-metadata.json
          python3 - <<'PY'
          import json
          metadata = json.load(open("/tmp/endfield-cargo-metadata.json", encoding="utf-8"))
          binaries = [
              (package["name"], target["name"])
              for package in metadata["packages"]
              for target in package["targets"]
              if "bin" in target["kind"]
          ]
          binaries.sort()
          assert binaries == [
              ("endfield-unix", "endfield-unix"),
              ("endfield-unixd", "endfield-unixd"),
          ], binaries
          domain = next(package for package in metadata["packages"] if package["name"] == "endfield-unix-domain")
          assert domain["dependencies"] == [], domain["dependencies"]
          assert any("lib" in target["kind"] for target in domain["targets"]), domain["targets"]
          assert not any("bin" in target["kind"] for target in domain["targets"]), domain["targets"]
          gui_dependencies = {"gtk4", "libadwaita", "relm4"}
          telemetry = next(package for package in metadata["packages"] if package["name"] == "endfield-unix-telemetry")
          assert any("lib" in target["kind"] for target in telemetry["targets"]), telemetry["targets"]
          assert not any("bin" in target["kind"] for target in telemetry["targets"]), telemetry["targets"]
          assert {dependency["name"] for dependency in telemetry["dependencies"]} == {"endfield-unix-domain"}, telemetry["dependencies"]
          assert not any(dependency["name"] in gui_dependencies for dependency in telemetry["dependencies"]), telemetry["dependencies"]
          assert not any(dependency["name"] in {"ash", "nix", "vulkan", "wayland-client", "wayland-protocols", "x11rb"} for dependency in telemetry["dependencies"]), telemetry["dependencies"]
          diagnostics = next(package for package in metadata["packages"] if package["name"] == "endfield-unix-diagnostics")
          assert any("lib" in target["kind"] for target in diagnostics["targets"]), diagnostics["targets"]
          assert not any("bin" in target["kind"] for target in diagnostics["targets"]), diagnostics["targets"]
          assert not any(dependency["name"] in gui_dependencies for dependency in diagnostics["dependencies"]), diagnostics["dependencies"]
          platform = next(package for package in metadata["packages"] if package["name"] == "endfield-unix-platform-linux")
          assert any("lib" in target["kind"] for target in platform["targets"]), platform["targets"]
          assert not any("bin" in target["kind"] for target in platform["targets"]), platform["targets"]
          assert not any(dependency["name"] in gui_dependencies for dependency in platform["dependencies"]), platform["dependencies"]
          assert "csv" in {dependency["name"] for dependency in platform["dependencies"]}, platform["dependencies"]
          assert not any(dependency["name"] in {"mangohud", "MangoHud"} for dependency in platform["dependencies"]), platform["dependencies"]
          assert "endfield-unix-telemetry" in {dependency["name"] for dependency in platform["dependencies"]}, platform["dependencies"]
          assert {"wayland-client", "wayland-protocols", "x11rb"}.issubset({dependency["name"] for dependency in platform["dependencies"]})
          assert not any(dependency["name"] in {"ash", "vulkan", "vulkano"} for dependency in telemetry["dependencies"]), telemetry["dependencies"]
          runtime = next(package for package in metadata["packages"] if package["name"] == "endfield-unix-runtime")
          assert any("lib" in target["kind"] for target in runtime["targets"]), runtime["targets"]
          assert not any("bin" in target["kind"] for target in runtime["targets"]), runtime["targets"]
          assert {dependency["name"] for dependency in runtime["dependencies"]} == {"serde_json"}, runtime["dependencies"]
          assert not any(dependency["name"] in gui_dependencies for dependency in runtime["dependencies"]), runtime["dependencies"]
          assert not any(dependency["name"] in {"ash", "nix", "vulkan", "vulkano", "wayland-client", "wayland-protocols", "x11rb"} for dependency in runtime["dependencies"]), runtime["dependencies"]
          runtime_linux = next(package for package in metadata["packages"] if package["name"] == "endfield-unix-runtime-linux")
          assert any("lib" in target["kind"] for target in runtime_linux["targets"]), runtime_linux["targets"]
          assert not any("bin" in target["kind"] for target in runtime_linux["targets"]), runtime_linux["targets"]
          assert {dependency["name"] for dependency in runtime_linux["dependencies"]} == {"endfield-unix-runtime", "libc", "sha2"}, runtime_linux["dependencies"]
          assert not any(dependency["name"] in gui_dependencies | {"endfield-unixd", "ash", "nix", "vulkan", "vulkano", "wayland-client", "wayland-protocols", "x11rb"} for dependency in runtime_linux["dependencies"]), runtime_linux["dependencies"]
          verification = next(p for p in metadata["packages"] if p["name"] == "endfield-unix-runtime-verification")
          assert all("bin" not in t["kind"] for t in verification["targets"])
          assert not ({d["name"] for d in verification["dependencies"]} & (gui_dependencies | {"endfield-unixd", "ash", "vulkan", "systemd", "x11rb"}))
          runtime_install = next(p for p in metadata["packages"] if p["name"] == "endfield-unix-runtime-install")
          assert any("lib" in t["kind"] for t in runtime_install["targets"])
          assert all("bin" not in t["kind"] for t in runtime_install["targets"])
          assert not ({d["name"] for d in runtime_install["dependencies"]} & (gui_dependencies | {"endfield-unixd", "ash", "vulkan", "systemd", "x11rb"}))
          assert {"endfield-unix-runtime", "endfield-unix-runtime-verification", "endfield-unix-storage"}.issubset({d["name"] for d in runtime_install["dependencies"]})
          runtime_audit = next(p for p in metadata["packages"] if p["name"] == "endfield-unix-runtime-audit")
          assert any("lib" in t["kind"] for t in runtime_audit["targets"])
          assert all("bin" not in t["kind"] for t in runtime_audit["targets"])
          assert not ({d["name"] for d in runtime_audit["dependencies"]} & (gui_dependencies | {"endfield-unixd", "ash", "vulkan", "systemd", "x11rb"}))
          selection = next(p for p in metadata["packages"] if p["name"] == "endfield-unix-runtime-selection")
          assert any("lib" in t["kind"] for t in selection["targets"])
          assert all("bin" not in t["kind"] for t in selection["targets"])
          assert {d["name"] for d in selection["dependencies"]} == {"endfield-unix-runtime", "endfield-unix-storage", "fs2", "libc", "serde", "serde_json", "sha2", "thiserror", "tempfile"}, selection["dependencies"]
          assert not ({d["name"] for d in selection["dependencies"]} & (gui_dependencies | {"endfield-unixd", "ash", "vulkan", "systemd", "x11rb"}))
          prefixes = next(p for p in metadata["packages"] if p["name"] == "endfield-unix-prefix-management")
          assert any("lib" in t["kind"] for t in prefixes["targets"]), prefixes["targets"]
          assert all("bin" not in t["kind"] for t in prefixes["targets"]), prefixes["targets"]
          assert {d["name"] for d in prefixes["dependencies"]} == {"endfield-unix-runtime-selection", "endfield-unix-storage", "fs2", "libc", "serde", "serde_json", "sha2", "thiserror", "tempfile"}, prefixes["dependencies"]
          assert not ({d["name"] for d in prefixes["dependencies"]} & (gui_dependencies | {"endfield-unixd", "ash", "vulkan", "systemd", "x11rb"}))
          sources = next(p for p in metadata["packages"] if p["name"] == "endfield-unix-game-sources")
          assert all("bin" not in t["kind"] for t in sources["targets"])
          assert {d["name"] for d in sources["dependencies"]} == {"serde", "sha2", "thiserror", "libc", "serde_json", "tempfile"}
          ipc = next(package for package in metadata["packages"] if package["name"] == "endfield-unix-ipc")
          assert any("lib" in target["kind"] for target in ipc["targets"]), ipc["targets"]
          assert not any("bin" in target["kind"] for target in ipc["targets"]), ipc["targets"]
          assert not any(dependency["name"] in gui_dependencies for dependency in ipc["dependencies"]), ipc["dependencies"]
          sessions = next(package for package in metadata["packages"] if package["name"] == "endfield-unix-sessions")
          assert any("lib" in target["kind"] for target in sessions["targets"]), sessions["targets"]
          assert not any("bin" in target["kind"] for target in sessions["targets"]), sessions["targets"]
          assert not any(dependency["name"] in gui_dependencies for dependency in sessions["dependencies"]), sessions["dependencies"]
          daemon = next(package for package in metadata["packages"] if package["name"] == "endfield-unixd")
          assert any("bin" in target["kind"] and target["name"] == "endfield-unixd" for target in daemon["targets"]), daemon["targets"]
          assert not any(dependency["name"] in gui_dependencies for dependency in daemon["dependencies"]), daemon["dependencies"]
          optimizer = next(package for package in metadata["packages"] if package["name"] == "optimizer-ffi")
          assert not any(dependency["name"] in {"wayland-client", "wayland-protocols", "x11rb"} for dependency in optimizer["dependencies"]), optimizer["dependencies"]
          PY

  c17:
    name: C17 ABI tests (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compile header and run independent ABI tests
        env:
          CC: ${{ matrix.compiler }}
        run: native/optimizer/tests/run-c-tests.sh
