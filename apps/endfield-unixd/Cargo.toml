[package]
name = "endfield-unixd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Foreground lifecycle daemon for endfield-unix"

[dependencies]
endfield-unix-diagnostics = { path = "../../crates/diagnostics" }
endfield-unix-ipc = { path = "../../crates/ipc" }
endfield-unix-sessions = { path = "../../crates/sessions" }
nix = { version = "=0.29.0", features = ["user"] }
signal-hook = "=0.3.18"
thiserror = "=2.0.11"

[dev-dependencies]
libc = "=0.2.191"
serde_json = "=1.0.145"
tempfile = "=3.15.0"
