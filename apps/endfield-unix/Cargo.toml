[package]
name = "endfield-unix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared GUI and CLI foundation for Endfield on Unix-like systems"
default-run = "endfield-unix"

[dependencies]
adw = { package = "libadwaita", version = "=0.7.2", features = ["v1_4"] }
gtk = { package = "gtk4", version = "=0.9.6" }
relm4 = { version = "=0.9.1", features = ["libadwaita"] }
