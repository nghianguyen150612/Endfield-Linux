[package]
name = "endfield-unix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native community launcher and goal-driven optimization application for Arknights: Endfield on Unix-like systems"
default-run = "endfield-unix"

[dependencies]
endfield-unix-runtime-verification = { path = "../../crates/runtime-verification" }
clap = { version = "=4.5.53", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
endfield-unix-diagnostics = { path = "../../crates/diagnostics" }
endfield-unix-domain = { path = "../../crates/domain" }
endfield-unix-ipc = { path = "../../crates/ipc" }
endfield-unix-platform-linux = { path = "../../crates/platform-linux" }
endfield-unix-runtime = { path = "../../crates/runtime" }
endfield-unix-runtime-linux = { path = "../../crates/runtime-linux" }
endfield-unix-telemetry = { path = "../../crates/telemetry" }
adw = { package = "libadwaita", version = "=0.7.2", features = ["v1_4"] }
gtk = { package = "gtk4", version = "=0.9.6" }
relm4 = { version = "=0.9.1", features = ["libadwaita"] }
nix = { version = "=0.29.0", features = ["user"] }
fs2 = "=0.4.3"
libc = "=0.2.191"

[dev-dependencies]
nix = { version = "=0.29.0", features = ["signal"] }
serde_json = "=1.0.145"
tempfile = "=3.15.0"
