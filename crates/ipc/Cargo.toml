[package]
name = "endfield-unix-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Versioned, authenticated Linux local IPC for endfield-unix"

[lib]
name = "endfield_unix_ipc"
path = "src/lib.rs"

[dependencies]
fs2 = "=0.4.3"
libc = "=0.2.191"
nix = { version = "=0.29.0", features = ["poll", "socket", "user"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.11"

[dev-dependencies]
tempfile = "=3.15.0"
