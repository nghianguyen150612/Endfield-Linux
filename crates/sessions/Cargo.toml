[package]
name = "endfield-unix-sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Bounded daemon-owned process session supervision contracts"

[lib]
name = "endfield_unix_sessions"
path = "src/lib.rs"

[dependencies]
endfield-unix-telemetry = { path = "../telemetry" }
getrandom = "=0.2.17"
libc = "=0.2.191"
thiserror = "=2.0.11"

[dev-dependencies]
libc = "=0.2.191"
nix = { version = "=0.29.0", features = ["process"] }
