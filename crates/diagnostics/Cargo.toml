[package]
name = "endfield-unix-diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Structured local diagnostics and privacy-safe support reports for endfield-unix"

[lib]
name = "endfield_unix_diagnostics"
path = "src/lib.rs"

[dependencies]
endfield-unix-domain = { path = "../domain" }
fs2 = "=0.4.3"
libc = "=0.2.191"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.11"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", default-features = false, features = ["registry", "std"] }

[dev-dependencies]
tempfile = "=3.15.0"
