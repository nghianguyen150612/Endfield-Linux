[package]
name = "endfield-unix-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Local configuration and SQLite persistence for endfield-unix"

[lib]
name = "endfield_unix_storage"
path = "src/lib.rs"

[dependencies]
fs2 = "=0.4.3"
libc = "=0.2.191"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.11"
toml = "=0.9.5"

[dev-dependencies]
tempfile = "=3.15.0"
