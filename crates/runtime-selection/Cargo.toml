[package]
name = "endfield-unix-runtime-selection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Persistent non-executable machine and profile runtime selection"

[lib]
name = "endfield_unix_runtime_selection"
path = "src/lib.rs"

[dependencies]
endfield-unix-runtime = { path = "../runtime" }
endfield-unix-storage = { path = "../storage" }
fs2 = "=0.4.3"
libc = "=0.2.191"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.11"

[dev-dependencies]
tempfile = "=3.15.0"
