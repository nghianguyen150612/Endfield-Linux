[package]
name = "endfield-unix-platform-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Read-only Linux platform and runtime environment discovery for endfield-unix"

[lib]
name = "endfield_unix_platform_linux"
path = "src/lib.rs"

[dependencies]
endfield-unix-domain = { path = "../domain" }
libc = "=0.2.191"
nix = { version = "=0.29.0", features = ["feature", "user"] }

[dev-dependencies]
tempfile = "=3.15.0"
