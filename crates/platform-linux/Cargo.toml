[package]
name = "endfield-unix-platform-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Read-only Linux platform and runtime environment discovery for endfield-unix"

[lib]
name = "endfield_unix_platform_linux"
path = "src/lib.rs"

[dependencies]
endfield-unix-domain = { path = "../domain" }
endfield-unix-telemetry = { path = "../telemetry" }
libc = "=0.2.191"
ash = { version = "=0.38.0", default-features = false, features = ["loaded"] }
nix = { version = "=0.29.0", features = ["feature", "fs", "poll", "user"] }
wayland-client = "=0.31.11"
wayland-protocols = { version = "=0.32.9", features = ["client", "unstable"] }
x11rb = { version = "=0.13.2", features = ["randr"] }

libloading = "=0.8.9"
csv = "=1.3.1"

[dev-dependencies]
tempfile = "=3.15.0"
